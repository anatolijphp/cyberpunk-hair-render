name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  LLVM_MINGW_VERSION: "20261020"
  DXC_VERSION: "v1.9.2609"
  DXC_ARCHIVE: "linux_dxc_2026_09_28.x86_x64.tar.gz"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags, for the package version

      - name: Cache toolchains
        id: tools
        uses: actions/cache@v4
        with:
          path: ~/tools
          key: tools-llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-dxc-${{ env.DXC_VERSION }}

      - name: Download toolchains
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/tools/dxc
          curl -fsSL "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz" \
            | tar xJ -C ~/tools
          mv ~/tools/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64 ~/tools/llvm-mingw
          curl -fsSL "https://github.com/microsoft/DirectXShaderCompiler/releases/download/${DXC_VERSION}/${DXC_ARCHIVE}" \
            | tar xz -C ~/tools/dxc

      - name: Build and package
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          LLVM_MINGW=~/tools/llvm-mingw DXC=~/tools/dxc ./package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: cp2077-hairfix
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cp2077-hairfix
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
          fi
