; Cyberpunk 2077 hair dither fix
; Home opens the settings overlay, F10 toggles the fix on/off in game. Changes to this file are picked up while the game runs,
; except Enabled, ToggleKey, OverlayKey and [Debug] LogFrames / DumpShaders, which need a restart.
[Hair]
; false = the mod does nothing at all (FSR is passed through untouched)
Enabled = true
; raw | sharpen
Coverage = raw
; box | strand
Resolve = strand
; 0 = sharp ... 1 = soft
Strength = 0.5
; hand FSR the nearest hair depth / motion vectors on hair pixels (can reduce flicker)
StabilizeDepth = false
; only used when Coverage = sharpen; presets: threshold 0.2/0.3/0.4/0.5, width 1/1.5/2/3 px
SharpenThreshold = 0.3
SharpenWidth = 2.0
; unsharp mask on hair only, after the upscale
UnsharpMask = true
; strength, blur radius (px), and minimum detail (relative to brightness) to sharpen
USMAmount = 1.0
USMRadius = 2.5
USMThreshold = 0.05
; virtual-key code of the in-game on/off toggle (0x79 = F10)
ToggleKey = 0x79
; virtual-key code of the settings overlay key (0x24 = Home; F9 is the game's quickload)
OverlayKey = 0x24

[Debug]
; 0 off, 1 coverage, 2 hair-surface mask (red) + coverage (green), 3 strand coherence, 4 USM mask
View = 0
; log hair draw counts every 1000 frames
LogFrames = false
; dump hair shaders and root signatures into hairfix_dump\
DumpShaders = false
; log the compute work of a few frames into hairfix.log (to find the built-in FSR 2.1); slow, restart needed
ProbeUpscaler = false
