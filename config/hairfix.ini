; Cyberpunk 2077 hair dither fix
; Home opens the settings overlay, F10 toggles the fix on/off in game. Changes to this file are picked up while the game runs,
; except Enabled, ToggleKey, OverlayKey and [Debug] LogFrames / DumpShaders, which need a restart.
[Hair]
; false = the mod does nothing at all (FSR is passed through untouched)
Enabled = true
; raw | sharpen
Coverage = raw
; box | strand | neural (strand + a network from the raw frame, needs hairfix_resolve.bin;
; without it the strand resolve stays)
Resolve = strand
; 0 = sharp ... 1 = soft
Strength = 0.65
; where the mod works: how far (render pixels) from strand edges into fully filled hair, where no
; background shows through; outside, the image is the game's own (as without the mod); 16 = all hair
Area = 0
; width (render pixels) of the soft transition beyond the area's border; 0.5 = hard
AreaFeather = 9.5
; hand FSR the nearest hair depth / motion vectors on hair pixels (can reduce flicker)
StabilizeDepth = true
; also fix hair in mirrors (they render their own view, without FSR), with the [Mirror] settings
Mirror = true
; only used when Coverage = sharpen; presets: threshold 0.2/0.3/0.4/0.5, width 1/1.5/2/3 px
SharpenThreshold = 0.3
SharpenWidth = 2.0
; unsharp mask on hair only, after the upscale
UnsharpMask = true
; strength, blur radius (px), and minimum detail (relative to brightness) to sharpen
USMAmount = 1.15
USMRadius = 2.99
USMThreshold = 0.01
; virtual-key code of the in-game on/off toggle (0x79 = F10)
ToggleKey = 0x79
; virtual-key code of the settings overlay key (0x24 = Home; F9 is the game's quickload)
OverlayKey = 0x24


[Mirror]
; mirrors: the same settings as above, for the mirror's own view (rendered without FSR, at its own scale)
Resolve = strand
Strength = 0.65
Area = 0
AreaFeather = 12.6
UnsharpMask = true
USMAmount = 1.65
; in the mirror's own pixels
USMRadius = 2.52
USMThreshold = 0
[Debug]
; 0 off, 1 coverage, 2 hair-surface mask (red) + coverage (green), 3 strand coherence, 4 USM mask,
; 5 network mask, 6 network correction (grey = none), 7 mod area (red: hair outside it)
View = 0
; log hair draw counts every 1000 frames
LogFrames = false
; dump hair shaders and root signatures into hairfix_dump\
DumpShaders = false
; log the compute work of a few frames into hairfix.log (to find the built-in FSR 2.1); slow, restart needed
ProbeUpscaler = false
; training capture (see training\README.md): with the scene still (pause, photo mode), this key
; records frames into hairfix_capture\ (mod on, then off); with the CET script
; training\cet\hairfix_capture installed, in photo mode it records a sweep of character rotations;
; 0 = off, e.g. 0x77 = F8; restart needed
CaptureKey = 0
